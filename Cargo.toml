[package]
name = "vestrace-integration-tests"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[workspace]
resolver = "3"
members = [
  "crates/vestrace-domain",
  "crates/vestrace-application",
  "crates/vestrace-infrastructure",
  "crates/vestrace-http",
  "crates/vestrace-cli",
  "crates/vestrace-fault-scenario",
  "crates/vestrace-mcp",
  "crates/vestrace-rig-spike",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
a2a = { package = "a2a-lf", version = "=0.3.0" }
a2a-client = { package = "a2a-client-lf", version = "=0.2.1" }
a2a-server = { package = "a2a-server-lf", version = "=0.4.1" }
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
static_assertions = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["macros"] }
tokio.workspace = true
tower.workspace = true
vestrace-application = { path = "crates/vestrace-application" }
vestrace-domain = { path = "crates/vestrace-domain" }
vestrace-http = { path = "crates/vestrace-http" }
vestrace-infrastructure = { path = "crates/vestrace-infrastructure" }
