[package]
name = "vestrace-http"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
a2a.workspace = true
a2a-server.workspace = true
async-stream.workspace = true
axum.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["time"] }
serde_urlencoded = "0.7"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# The effect surface digests request arguments rather than storing them: a
# record carrying the body verbatim is one more place a credential can be
# written and then read by everyone who can read a trace.
sha2.workspace = true
tracing.workspace = true
uuid.workspace = true
vestrace-application = { path = "../vestrace-application" }
vestrace-domain = { path = "../vestrace-domain" }

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
