[package]
name = "vestrace-infrastructure"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
config.workspace = true
reqwest = { workspace = true, features = ["json"] }
# The webhook effect adapter drives its request on a runtime of its own: the
# domain's dispatch is synchronous, and blocking the caller's reactor would
# stall every other task in the process for the length of somebody else's
# network call.
tokio.workspace = true
ring.workspace = true
secrecy.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["macros"] }
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
vestrace-application = { path = "../vestrace-application" }
vestrace-domain = { path = "../vestrace-domain" }

[dev-dependencies]
base64.workspace = true
sqlx = { workspace = true, features = ["macros"] }
temp-env = "0.3"
tempfile = "3"
vestrace-application = { path = "../vestrace-application" }
vestrace-domain = { path = "../vestrace-domain" }
