name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format-p0-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/p0-stabilization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "style: apply rustfmt across workspace"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://vestrace:vestrace@localhost:5432/vestrace_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: vestrace_test
          POSTGRES_USER: vestrace
          POSTGRES_PASSWORD: vestrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vestrace -d vestrace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
        working-directory: apps/console
      - run: npm run typecheck
        working-directory: apps/console
      - run: npm run build
        working-directory: apps/console

  compose-acceptance:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: vestrace-foundation-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: timeout 300s docker compose up --build --detach --wait --wait-timeout 180
      - run: ./scripts/foundation-smoke.sh
      - run: timeout 90s ./scripts/foundation-runtime-rls.sh
      - if: always()
        run: docker compose down --volumes --remove-orphans
