name: Bug report
description: Report a reproducible defect in Vestrace
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Vestrace. Please do not disclose security vulnerabilities here; use the Security Policy instead.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of Vestrace is affected?
      options:
        - Rust services / application core
        - HTTP API
        - MCP interface
        - CLI
        - Console
        - PostgreSQL / migrations
        - Docker / Compose / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release, branch, or commit SHA where you observed the issue.
      placeholder: "main @ abc1234"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Rust/Node versions when relevant, database version, deployment shape, and other details needed to reproduce the issue.
      placeholder: |
        OS: Ubuntu 24.04
        Rust: 1.85
        PostgreSQL: 17 + pgvector
        Deployment: local / Docker Compose / other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reliably demonstrates the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or evidence
      description: Paste only the relevant excerpt. Remove tokens, credentials, private data, and unrelated secrets.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, suspected regressions, related issues, or other useful context.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I have not included credentials, tokens, private data, or other secrets.
          required: true
        - label: This is not a vulnerability report that should be disclosed privately.
          required: true