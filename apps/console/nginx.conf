server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://vestrace-server:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ag-ui/ {
        proxy_pass http://vestrace-server:8080/ag-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Server-sent events must not be buffered or timed out by the proxy.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/health/ {
        proxy_pass http://vestrace-server:8080/health/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
